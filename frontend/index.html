<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semiformal Programming Playground (IR-based)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #252526;
      padding: 1rem 2rem;
      border-bottom: 1px solid #3e3e42;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #cccccc;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #858585;
      margin-top: 0.25rem;
    }

    .instructions {
      margin-top: 0.75rem;
      padding: 0.75rem;
      background: rgba(0, 122, 204, 0.1);
      border-left: 3px solid #007acc;
      border-radius: 4px;
      font-size: 0.875rem;
      color: #cccccc;
    }

    .instructions code {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.125rem 0.375rem;
      border-radius: 3px;
      font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
      color: #4ec9b0;
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e42;
      background: #1e1e1e;
    }

    .editor-container:last-child {
      border-right: none;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #252526;
      border-bottom: 1px solid #3e3e42;
    }

    .editor-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #cccccc;
    }

    .editor-hint {
      font-size: 0.75rem;
      color: #858585;
      font-style: italic;
    }

    .editor-wrapper {
      flex: 1;
      overflow: auto;
    }

    .cm-editor {
      height: 100%;
      font-size: 14px;
      background: #1e1e1e !important;
    }

    .cm-gutters {
      background: #1e1e1e !important;
      border-right: 1px solid #3e3e42 !important;
    }

    .cm-incomplete {
      opacity: 0.5;
      font-style: italic;
    }

    .cm-stub {
      background: rgba(255, 203, 107, 0.1);
      border-left: 2px solid #ffcb6b;
    }

    .status-bar {
      padding: 0.5rem 1rem;
      background: #007acc;
      color: white;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-bar.error {
      background: #f48771;
    }

    .status-bar.success {
      background: #4ec9b0;
    }

    .status-bar.info {
      background: #007acc;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <main>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">Semiformal Specification</span>
          <span class="editor-hint">Automatic parsing • Cmd+S to generate</span>
        </div>
        <div class="editor-wrapper">
          <div id="spec-editor"></div>
        </div>
      </div>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">Generated Python Code</span>
          <span class="editor-hint">Updated on save • Unified-diff based</span>
        </div>
        <div class="editor-wrapper">
          <div id="code-editor"></div>
        </div>
      </div>
    </main>
    <div id="status-bar" class="status-bar" style="display: none;"></div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
