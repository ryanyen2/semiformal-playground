<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semiformal Programming Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #ffffff;
      color: #24292e;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #f6f8fa;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #e1e4e8;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #24292e;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #586069;
      margin-top: 0.25rem;
    }

    .hint {
      font-size: 0.75rem;
      color: #22863a;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e1e4e8;
      background: #ffffff;
      min-width: 0;
    }

    .editor-container:last-child {
      border-right: none;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #f6f8fa;
      border-bottom: 1px solid #e1e4e8;
      flex-shrink: 0;
    }

    .editor-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #24292e;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .editor-status {
      font-size: 0.7rem;
      color: #586069;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #28a745;
      animation: pulse 2s infinite;
    }

    .status-dot.parsing {
      background: #ffc107;
    }

    .status-dot.generating {
      background: #6f42c1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .editor-wrapper {
      flex: 1;
      overflow: auto;
      min-height: 0;
    }

    .cm-editor {
      height: 100%;
      font-size: 14px;
      background: #ffffff !important;
    }

    .cm-scroller {
      overflow: auto;
    }

    .cm-gutters {
      background: #ffffff !important;
      border-right: 1px solid #e1e4e8 !important;
    }

    /* Node mapping decorations */
    .cm-nl-text {
      color: #22863a !important;
      font-style: italic;
      opacity: 0.9;
    }

    .cm-nl-text *,
    .cm-nl-text span,
    .cm-nl-text [class*="ͼ"] {
      color: #22863a !important;
      font-style: italic;
    }

    .cm-hole {
      background: rgba(255, 193, 7, 0.2);
      border-bottom: 2px dotted #ffc107;
      color: #b08800 !important;
    }

    .cm-hole *,
    .cm-hole span,
    .cm-hole [class*="ͼ"] {
      color: #b08800 !important;
    }

    .cm-hole-hint {
      background: rgba(111, 66, 193, 0.15);
      border-bottom: 2px dotted #6f42c1;
      color: #6f42c1 !important;
    }

    .cm-hole-hint *,
    .cm-hole-hint span,
    .cm-hole-hint [class*="ͼ"] {
      color: #6f42c1 !important;
    }

    .cm-placeholder {
      background: rgba(40, 167, 69, 0.1);
      border-left: 2px solid #28a745;
      color: #28a745 !important;
    }

    .cm-placeholder *,
    .cm-placeholder span,
    .cm-placeholder [class*="ͼ"] {
      color: #28a745 !important;
    }

    /* Semiformal syntax highlighting (real-time, before parsing) */
    .cm-semiformal-hole {
      background: rgba(255, 193, 7, 0.15);
      border-bottom: 2px dotted #ffc107;
      color: #b08800 !important;
      font-weight: 500;
    }

    .cm-semiformal-hole *,
    .cm-semiformal-hole span,
    .cm-semiformal-hole [class*="ͼ"] {
      color: #b08800 !important;
    }

    .cm-semiformal-ellipsis {
      background: rgba(215, 58, 73, 0.1);
      color: #d73a49 !important;
      font-weight: 500;
    }

    .cm-semiformal-ellipsis *,
    .cm-semiformal-ellipsis span,
    .cm-semiformal-ellipsis [class*="ͼ"] {
      color: #d73a49 !important;
    }

    .cm-semiformal-nl {
      color: #22863a !important;
      font-style: italic;
      background: rgba(34, 134, 58, 0.05);
    }

    .cm-semiformal-nl *,
    .cm-semiformal-nl span,
    .cm-semiformal-nl [class*="ͼ"] {
      color: #22863a !important;
      font-style: italic;
    }

    .cm-node-highlight {
      background: rgba(3, 102, 214, 0.15);
      border-radius: 3px;
    }

    /* Token-based highlighting */
    .cm-python-mapped-token {
      background: rgba(3, 102, 214, 0.2);
      border-radius: 2px;
      padding: 0 2px;
      font-weight: 500;
      box-shadow: 0 0 0 1px rgba(3, 102, 214, 0.3);
    }

    .cm-python-mapped-line-bg {
      background: rgba(3, 102, 214, 0.05);
    }

    .cm-python-line-marker {
      position: absolute;
      width: 3px;
      height: 100%;
      left: 0;
      background: linear-gradient(to right, #0366d6, transparent);
    }

    /* Unmapped code regions - reduced opacity */
    .cm-unmapped-code {
      opacity: 0.5;
    }

    /* Status bar */
    .status-bar {
      padding: 0.4rem 1rem;
      background: #f6f8fa;
      border-top: 1px solid #e1e4e8;
      color: #24292e;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .status-bar.parsing {
      background: rgba(255, 193, 7, 0.15);
      border-top-color: #ffc107;
    }

    .status-bar.generating {
      background: rgba(111, 66, 193, 0.15);
      border-top-color: #6f42c1;
    }

    .status-bar.error {
      background: rgba(215, 58, 73, 0.15);
      border-top-color: #d73a49;
      color: #d73a49;
    }

    .status-bar.success {
      background: rgba(40, 167, 69, 0.15);
      border-top-color: #28a745;
      color: #28a745;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-separator {
      width: 1px;
      height: 1rem;
      background: #e1e4e8;
    }

    /* AST Viewer */
    .ast-viewer-container {
      width: 320px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #e1e4e8;
      background: #ffffff;
      overflow: hidden;
    }

    .ast-viewer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #f6f8fa;
      border-bottom: 1px solid #e1e4e8;
      flex-shrink: 0;
    }

    .ast-viewer-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #24292e;
    }

    .ast-viewer-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0.5rem;
    }

    .ast-tree {
      font-size: 0.75rem;
      font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
    }

    .ast-empty {
      color: #586069;
      font-style: italic;
      padding: 1rem;
      text-align: center;
    }

    .ast-line-group {
      margin-bottom: 0.75rem;
    }

    .ast-line-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.5rem;
      background: #f6f8fa;
      border-radius: 3px;
      cursor: pointer;
      user-select: none;
    }

    .ast-line-header:hover {
      background: #e1e4e8;
    }

    .ast-line-label {
      color: #586069;
      font-weight: 600;
    }

    .ast-node-count {
      color: #22863a;
      font-size: 0.7rem;
      margin-left: auto;
    }

    .ast-toggle {
      width: 1rem;
      height: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #586069;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    .ast-toggle:hover {
      color: #24292e;
    }

    .ast-toggle-small {
      width: 0.85rem;
      height: 0.85rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #586069;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      margin-right: 0.25rem;
    }

    .ast-toggle-small:hover {
      color: #24292e;
    }

    .ast-nodes-container {
      padding-left: 1rem;
      margin-top: 0.25rem;
    }

    .ast-node {
      padding: 0.35rem 0.5rem;
      margin: 0.15rem 0;
      border-left: 2px solid transparent;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ast-node:hover {
      background: rgba(3, 102, 214, 0.1);
      border-left-color: #0366d6;
    }

    .ast-node-selected {
      background: rgba(3, 102, 214, 0.15);
      border-left-color: #0366d6;
    }

    .ast-node-header {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .ast-node-type {
      font-weight: 600;
      padding: 0.1rem 0.35rem;
      border-radius: 2px;
      font-size: 0.7rem;
    }

    /* Node type colors */
    .ast-type-identifier {
      color: #005cc5;
      background: rgba(0, 92, 197, 0.1);
    }

    .ast-type-nl_phrase {
      color: #22863a;
      background: rgba(34, 134, 58, 0.1);
    }

    .ast-type-nl_text {
      color: #22863a;
      background: rgba(34, 134, 58, 0.1);
    }

    .ast-type-function_call {
      color: #6f42c1;
      background: rgba(111, 66, 193, 0.1);
    }

    .ast-type-operator {
      color: #24292e;
      background: rgba(36, 41, 46, 0.1);
    }

    .ast-type-literal {
      color: #e36209;
      background: rgba(227, 98, 9, 0.1);
    }

    .ast-type-hole {
      color: #b08800;
      background: rgba(176, 136, 0, 0.1);
    }

    .ast-type-hole_hint {
      color: #6f42c1;
      background: rgba(111, 66, 193, 0.1);
    }

    .ast-type-hole_empty {
      color: #b08800;
      background: rgba(176, 136, 0, 0.1);
    }

    .ast-type-placeholder {
      color: #28a745;
      background: rgba(40, 167, 69, 0.1);
    }

    .ast-node-value {
      color: #24292e;
      word-break: break-word;
    }

    .ast-node-pos {
      color: #586069;
      font-size: 0.65rem;
      margin-left: auto;
    }

    .ast-metadata {
      margin-top: 0.25rem;
      padding-left: 1rem;
      border-left: 1px solid #e1e4e8;
    }

    .ast-metadata-item {
      padding: 0.15rem 0;
      color: #586069;
      font-size: 0.7rem;
    }

    .ast-metadata-key {
      color: #005cc5;
    }

    .ast-metadata-value {
      color: #e36209;
    }

    /* Scrollbar styling for AST viewer */
    .ast-viewer-wrapper::-webkit-scrollbar {
      width: 8px;
    }

    .ast-viewer-wrapper::-webkit-scrollbar-track {
      background: #ffffff;
    }

    .ast-viewer-wrapper::-webkit-scrollbar-thumb {
      background: #c1c8cd;
      border-radius: 4px;
    }

    .ast-viewer-wrapper::-webkit-scrollbar-thumb:hover {
      background: #a8b1b8;
    }
  </style>
</head>
<body>
  <div id="app">
    <main>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">
            Semiformal Code
          </span>
          <span class="editor-status">
            <span class="status-dot" id="spec-status-dot"></span>
            <span id="spec-status-text">Ready</span>
          </span>
        </div>
        <div class="editor-wrapper">
          <div id="spec-editor"></div>
        </div>
      </div>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">
            Generated Python
          </span>
          <span class="editor-status">
            <span class="status-dot" id="code-status-dot"></span>
            <span id="code-status-text">Not generated</span>
          </span>
        </div>
        <div class="editor-wrapper">
          <div id="code-editor"></div>
        </div>
      </div>
      <div class="ast-viewer-container">
        <div class="ast-viewer-header">
          <span class="ast-viewer-title">IR Tree</span>
        </div>
        <div class="ast-viewer-wrapper" id="ast-viewer"></div>
      </div>
    </main>
    <div id="status-bar" class="status-bar">
      <span class="status-item">
        <span id="status-message">Ready</span>
      </span>
      <span class="status-separator"></span>
      <span class="status-item">
        <span id="node-count">0 nodes</span>
      </span>
      <span class="status-separator"></span>
      <span class="status-item">
        <span id="llm-status">LLM: checking...</span>
      </span>
    </div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
