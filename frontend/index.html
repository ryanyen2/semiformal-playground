<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semiformal Programming Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #252526;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #3e3e42;
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #cccccc;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #858585;
      margin-top: 0.25rem;
    }

    .hint {
      font-size: 0.75rem;
      color: #6a9955;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e42;
      background: #1e1e1e;
      min-width: 0;
    }

    .editor-container:last-child {
      border-right: none;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      background: #252526;
      border-bottom: 1px solid #3e3e42;
      flex-shrink: 0;
    }

    .editor-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cccccc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .editor-status {
      font-size: 0.7rem;
      color: #858585;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ec9b0;
      animation: pulse 2s infinite;
    }

    .status-dot.parsing {
      background: #ffcb6b;
    }

    .status-dot.generating {
      background: #c586c0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .editor-wrapper {
      flex: 1;
      overflow: auto;
      min-height: 0;
    }

    .cm-editor {
      height: 100%;
      font-size: 14px;
      background: #1e1e1e !important;
    }

    .cm-scroller {
      overflow: auto;
    }

    .cm-gutters {
      background: #1e1e1e !important;
      border-right: 1px solid #3e3e42 !important;
    }

    /* Node mapping decorations */
    .cm-nl-text {
      color: #6a9955;
      font-style: italic;
      opacity: 0.9;
    }

    .cm-hole {
      background: rgba(255, 203, 107, 0.15);
      border-bottom: 2px dotted #ffcb6b;
    }

    .cm-hole-hint {
      background: rgba(197, 134, 192, 0.15);
      border-bottom: 2px dotted #c586c0;
    }

    .cm-placeholder {
      background: rgba(78, 201, 176, 0.1);
      border-left: 2px solid #4ec9b0;
    }

    .cm-node-highlight {
      background: rgba(82, 139, 255, 0.2);
      border-radius: 3px;
    }

    .cm-mapping-marker {
      position: absolute;
      width: 3px;
      height: 100%;
      left: 0;
      background: linear-gradient(to right, #0e639c, transparent);
    }

    .cm-python-mapped-line {
      background: rgba(82, 139, 255, 0.15);
      border-left: 3px solid #528bff;
    }

    .cm-python-line-marker {
      position: absolute;
      width: 3px;
      height: 100%;
      left: 0;
      background: linear-gradient(to right, #528bff, transparent);
    }

    /* Status bar */
    .status-bar {
      padding: 0.4rem 1rem;
      background: #252526;
      border-top: 1px solid #3e3e42;
      color: #d4d4d4;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
    }

    .status-bar.parsing {
      background: rgba(255, 203, 107, 0.2);
      border-top-color: #ffcb6b;
    }

    .status-bar.generating {
      background: rgba(197, 134, 192, 0.2);
      border-top-color: #c586c0;
    }

    .status-bar.error {
      background: rgba(244, 135, 113, 0.2);
      border-top-color: #f48771;
      color: #f48771;
    }

    .status-bar.success {
      background: rgba(78, 201, 176, 0.2);
      border-top-color: #4ec9b0;
      color: #4ec9b0;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-separator {
      width: 1px;
      height: 1rem;
      background: #3e3e42;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Semiformal Programming Playground</h1>
      <div class="subtitle">Bidirectional sync with CodeMirror and OpenAI</div>
      <div class="hint">Type to parse (auto-debounced) • Cmd+S to generate</div>
    </header>
    <main>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">
            Semiformal Code
          </span>
          <span class="editor-status">
            <span class="status-dot" id="spec-status-dot"></span>
            <span id="spec-status-text">Ready</span>
          </span>
        </div>
        <div class="editor-wrapper">
          <div id="spec-editor"></div>
        </div>
      </div>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">
            Generated Python
          </span>
          <span class="editor-status">
            <span class="status-dot" id="code-status-dot"></span>
            <span id="code-status-text">Not generated</span>
          </span>
        </div>
        <div class="editor-wrapper">
          <div id="code-editor"></div>
        </div>
      </div>
    </main>
    <div id="status-bar" class="status-bar">
      <span class="status-item">
        <span id="status-message">Ready</span>
      </span>
      <span class="status-separator"></span>
      <span class="status-item">
        <span id="node-count">0 nodes</span>
      </span>
      <span class="status-separator"></span>
      <span class="status-item">
        <span id="llm-status">LLM: checking...</span>
      </span>
    </div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
