<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semiformal Programming Playground</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #252526;
      padding: 1rem 2rem;
      border-bottom: 1px solid #3e3e42;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #cccccc;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #858585;
      margin-top: 0.25rem;
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e42;
      background: #1e1e1e;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #252526;
      border-bottom: 1px solid #3e3e42;
    }

    .editor-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #cccccc;
    }

    .editor-actions {
      display: flex;
      gap: 0.5rem;
    }

    button {
      padding: 0.5rem 1rem;
      background: #0e639c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: background 0.2s;
    }

    button:hover {
      background: #1177bb;
    }

    button:disabled {
      background: #3e3e42;
      cursor: not-allowed;
    }

    .editor-wrapper {
      flex: 1;
      overflow: auto;
    }

    .cm-editor {
      height: 100%;
      font-size: 14px;
      background: #1e1e1e !important;
    }

    .cm-gutters {
      background: #1e1e1e !important;
      border-right: 1px solid #3e3e42 !important;
    }

    .cm-incomplete {
      opacity: 0.5;
      font-style: italic;
    }

    .cm-stub {
      background: rgba(255, 203, 107, 0.1);
      border-left: 2px solid #ffcb6b;
    }

    .status-bar {
      padding: 0.5rem 1rem;
      background: #007acc;
      color: white;
      font-size: 0.875rem;
    }

    .status-bar.error {
      background: #f48771;
    }

    .status-bar.success {
      background: #4ec9b0;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Semiformal Programming Playground</h1>
      <div class="subtitle">Bidirectional programming with CodeMirror and Python</div>
    </header>
    <main>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">Semiformal Code (Specification)</span>
          <div class="editor-actions">
            <button id="parseBtn">Parse</button>
            <button id="generateBtn">Generate Code</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <div id="spec-editor"></div>
        </div>
      </div>
      <div class="editor-container">
        <div class="editor-header">
          <span class="editor-title">Generated Python Code</span>
          <div class="editor-actions">
            <button id="syncToSpecBtn">Sync to Spec</button>
          </div>
        </div>
        <div class="editor-wrapper">
          <div id="code-editor"></div>
        </div>
      </div>
    </main>
    <div id="status-bar" class="status-bar" style="display: none;"></div>
  </div>
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
